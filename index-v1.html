<!DOCTYPE html>
<!-- 테마 전환(F-12)은 아직 구현 전이다. OS 설정에 따라 기기마다 화면이 달라지지
     않도록 다크로 고정한다. tokens.css의 라이트 정의는 F-12에서 쓴다. -->
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex &amp; Grid Playground</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!--
  셸만 둔다. 속성별 버튼은 여기에 없다 — controls.js가 스키마에서 만든다.
  마크업에 속성이 등장하는 순간 스키마 주도 설계가 무너진다. v0.1이 실패한 지점이다.
-->

<header class="fgp-header">
  <h1 class="fgp-title">Flex &amp; Grid Playground</h1>
  <span class="fgp-badge" id="fgp-topic-badge"></span>
  <span class="fgp-header__spacer"></span>
  <div class="fgp-toolbar" role="group" aria-label="실행 취소">
    <button type="button" class="fgp-btn" data-action="undo" aria-keyshortcuts="Control+Z Meta+Z" disabled>↩ 되돌리기</button>
    <button type="button" class="fgp-btn" data-action="redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" disabled>↪ 다시 실행</button>
  </div>
  <span class="fgp-subtitle">M1 · 플레이그라운드</span>
</header>

<main class="fgp-shell">

  <aside class="fgp-panel">
    <section class="fgp-panel__section" aria-labelledby="fgp-controls-title">
      <h2 class="fgp-panel__title" id="fgp-controls-title">컨테이너 속성</h2>
      <!-- 컨트롤 마운트 지점 -->
      <div class="fgp-control-list" id="fgp-controls"></div>
    </section>

    <section class="fgp-panel__section" aria-labelledby="fgp-view-title">
      <div class="fgp-panel__head">
        <h2 class="fgp-panel__title" id="fgp-view-title">프리뷰 크기</h2>
        <button type="button" class="fgp-btn fgp-btn--quiet" data-action="view-reset">기본값으로</button>
      </div>
      <!-- 뷰 설정 컨트롤 마운트 지점. 스키마 속성이 아니다 -->
      <div class="fgp-control-list" id="fgp-view-controls"></div>
    </section>

    <section class="fgp-panel__section" aria-labelledby="fgp-items-title">
      <h2 class="fgp-panel__title" id="fgp-items-title">아이템</h2>
      <div class="fgp-itembar" id="fgp-itembar">
        <button type="button" class="fgp-btn" data-action="item-add">추가</button>
        <button type="button" class="fgp-btn" data-action="item-remove">제거</button>
        <output class="fgp-itembar__count" id="fgp-item-count"></output>
      </div>

      <p class="fgp-control__hint">
        선택된 아이템 <output class="fgp-mono" id="fgp-item-selected"></output> 의 크기
      </p>
      <!-- 아이템 기하값 마운트 지점. 스키마 속성이 아니다 -->
      <div class="fgp-control-list fgp-control-list--pair" id="fgp-item-size"></div>
    </section>
  </aside>

  <section class="fgp-preview" aria-label="프리뷰">
    <!-- 프리뷰 마운트 지점 -->
    <div class="fgp-preview__stage" id="fgp-preview"></div>
  </section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
